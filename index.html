<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>低空空域管理三维可视化平台</title>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.109.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: sans-serif; }
        #cesiumContainer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.109.0/Build/Cesium/Cesium.js"></script>
    <script>
        // 初始化Viewer
        const viewer = new Cesium.Viewer('cesiumContainer', {
    baseLayer: new Cesium.OpenStreetMapImageryProvider({
        url: 'https://tile.openstreetmap.org/'
    })
});

        viewer.cesiumWidget.creditContainer.style.display = 'none';

        // ========== 三维效果增强 ==========
        // 开启大气效果
        viewer.scene.globe.enableLighting = true;
        viewer.scene.skyAtmosphere.show = true;
        
        // 开启地形深度测试（让物体看起来是贴在地面上的）
        viewer.scene.globe.depthTestAgainstTerrain = true;

        // 飞到合肥市区，降低高度看立体感
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(117.2272, 31.8206, 2000),
            orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-60),
                roll: 0
            }
        });

        // ========== 模拟三维建筑（灰色方块） ==========
        const buildings = [
            { lon: 117.215, lat: 31.818, height: 80 },
            { lon: 117.220, lat: 31.822, height: 120 },
            { lon: 117.225, lat: 31.819, height: 60 },
            { lon: 117.230, lat: 31.823, height: 100 },
            { lon: 117.218, lat: 31.825, height: 90 },
        ];

        buildings.forEach(b => {
            viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(b.lon, b.lat, b.height / 2),
                box: {
                    dimensions: new Cesium.Cartesian3(50, 50, b.height),
                    material: Cesium.Color.GRAY.withAlpha(0.7),
                    outline: true,
                    outlineColor: Cesium.Color.DARKGRAY
                }
            });
        });

        // ========== 空域图层 ==========

        // 1. 禁飞区（红色）
        viewer.entities.add({
            name: '禁飞区',
            polygon: {
                hierarchy: Cesium.Cartesian3.fromDegreesArray([
                    117.20, 31.81,
                    117.25, 31.81,
                    117.25, 31.84,
                    117.20, 31.84
                ]),
                material: Cesium.Color.RED.withAlpha(0.3),
                outline: true,
                outlineColor: Cesium.Color.RED,
                height: 150
            }
        });

        // 2. 限飞区（黄色）
        viewer.entities.add({
            name: '限飞区',
            polygon: {
                hierarchy: Cesium.Cartesian3.fromDegreesArray([
                    117.18, 31.79,
                    117.27, 31.79,
                    117.27, 31.805,
                    117.18, 31.805
                ]),
                material: Cesium.Color.YELLOW.withAlpha(0.3),
                outline: true,
                outlineColor: Cesium.Color.YELLOW,
                height: 120
            }
        });

        // 3. 演示航线（绿色线，有高度）
        viewer.entities.add({
            name: '演示航线',
            polyline: {
                positions: Cesium.Cartesian3.fromDegreesArrayHeights([
                    117.19, 31.795, 80,
                    117.21, 31.80, 90,
                    117.23, 31.80, 85,
                    117.25, 31.805, 100
                ]),
                width: 3,
                material: Cesium.Color.GREEN
            }
        });

        // 4. 无人机（不同颜色不同类型）
        viewer.entities.add({
            name: '巡检无人机（蓝色）',
            position: Cesium.Cartesian3.fromDegrees(117.21, 31.82, 80),
            point: {
                pixelSize: 14,
                color: Cesium.Color.BLUE,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2
            }
        });

        viewer.entities.add({
            name: '配送无人机（橙色）',
            position: Cesium.Cartesian3.fromDegrees(117.23, 31.81, 100),
            point: {
                pixelSize: 14,
                color: Cesium.Color.ORANGE,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2
            }
        });

        viewer.entities.add({
            name: '测绘无人机（紫色）',
            position: Cesium.Cartesian3.fromDegrees(117.24, 31.83, 60),
            point: {
                pixelSize: 14,
                color: Cesium.Color.PURPLE,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2
            }
        });

        viewer.entities.add({
            name: '应急救援无人机（红色）',
            position: Cesium.Cartesian3.fromDegrees(117.22, 31.825, 120),
            point: {
                pixelSize: 14,
                color: Cesium.Color.RED,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2
            }
        });

    </script>
</body>
</html>
